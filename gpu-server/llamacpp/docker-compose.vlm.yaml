name: marketing-gpu-llamacpp-vlm

services:
  vlm-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: vlm-server
    ports:
      - "${LLAMACPP_VLM_PORT:-8001}:8000"
    volumes:
      - ${LLAMACPP_VLM_MODEL_HOST_DIR}:/models/vlm:ro
      - ${LLAMACPP_VLM_MM_PROJECTOR_HOST_DIR}:/models/mmproj:ro
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - -m
      - /models/vlm/${LLAMACPP_VLM_MODEL_FILE:-model.gguf}
      - --mmproj
      - /models/mmproj/${LLAMACPP_VLM_MM_PROJECTOR_FILE:-mmproj.gguf}
      - -c
      - "${LLAMACPP_VLM_CTX:-2048}"
      - -b
      - "${LLAMACPP_VLM_BATCH:-256}"
      - --n-gpu-layers
      - "${LLAMACPP_VLM_GPU_LAYERS:-35}"
      - --parallel
      - "1"
      - --cont-batching
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis-data:
