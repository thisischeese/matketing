[project]
name = "bestshot-benchmark"
version = "0.1.0"
description = "Local benchmark tooling for best-shot aesthetic model selection"
requires-python = ">=3.11,<4.0"
dependencies = [
  "numpy>=1.26.0,<3.0.0",
  "opencv-python-headless>=4.10.0,<5.0.0",
  "pillow>=10.0.0,<12.0.0",
]

[project.optional-dependencies]
scorers = [
  "pyiqa>=0.1.13,<1.0.0",
]

[project.scripts]
benchmark_aesthetic_models = "bestshot_benchmark.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0,<9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bestshot_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]

